name: Jogo - nove mapas e testes
on:
  push:
    paths:
      - 'projeto-jogo/**'
      - '.github/workflows/projeto-jogo.yml'
  pull_request:
    paths:
      - 'projeto-jogo/**'
      - '.github/workflows/projeto-jogo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regras-e-interface:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Conferir contrato CubeMX e fontes
        run: python3 projeto-jogo/scripts/check_config.py
      - name: Conferir geometria gerada
        run: python3 projeto-jogo/scripts/generate_map.py --check
      - name: Testar regras, renderizador e driver com sanitizadores
        run: python3 projeto-jogo/scripts/test_host.py --sanitize
  base-stm32f411:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador ARM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compilar a campanha de nove mapas
        run: python3 projeto-jogo/scripts/build_base.py
      - name: Compilar o diagnostico opcional
        run: python3 projeto-jogo/scripts/build_base.py --diagnostic
      - name: Disponibilizar firmware para teste
        uses: actions/upload-artifact@v4
        with:
          name: mic2-labirinto-campanha
          path: |
            projeto-jogo/build/campanha/labirinto-campanha.elf
            projeto-jogo/build/campanha/labirinto-campanha.hex
            projeto-jogo/build/campanha/labirinto-campanha.bin
          if-no-files-found: error
      - name: Disponibilizar diagnostico opcional
        uses: actions/upload-artifact@v4
        with:
          name: mic2-diagnostico-spi1
          path: |
            projeto-jogo/build/diagnostico/diagnostico-spi1.elf
            projeto-jogo/build/diagnostico/diagnostico-spi1.hex
            projeto-jogo/build/diagnostico/diagnostico-spi1.bin
          if-no-files-found: error
