name: Jogo - diagnostico de hardware
on:
  push:
    paths:
      - 'projeto-jogo/**'
      - '.github/workflows/projeto-jogo.yml'
  pull_request:
    paths:
      - 'projeto-jogo/**'
      - '.github/workflows/projeto-jogo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  base-stm32f411:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador ARM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compilar o diagnostico
        run: python3 projeto-jogo/scripts/build_base.py
      - name: Disponibilizar firmware para teste
        uses: actions/upload-artifact@v4
        with:
          name: mic2-diagnostico-spi1
          path: |
            projeto-jogo/build/base-professor.elf
            projeto-jogo/build/base-professor.hex
            projeto-jogo/build/base-professor.bin
          if-no-files-found: error
