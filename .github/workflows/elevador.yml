name: Elevador - testes e build
on:
  push:
    paths:
      - 'elevador/**'
      - 'ex_Barry_USB_STM32F411CE/**'
      - '.github/workflows/elevador.yml'
  pull_request:
    paths:
      - 'elevador/**'
      - 'ex_Barry_USB_STM32F411CE/**'
      - '.github/workflows/elevador.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  logica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testes C11 com avisos como erros
        run: make -C elevador test
      - name: Memoria e comportamento indefinido
        run: make -C elevador sanitize
  stm32f411:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compilador ARM
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-arm-none-eabi libnewlib-arm-none-eabi
      - name: Compilar e ligar port inativo com FreeRTOS
        run: python3 elevador/scripts/build_f411.py
